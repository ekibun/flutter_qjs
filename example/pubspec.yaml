name: flutter_qjs_example
description: "Demonstrates how to use the flutter_qjs plugin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The example app is bundled with the plugin, so depend on the local path to
  # always exercise the current sources.
  flutter_qjs:
    path: ../

  cupertino_icons: ^1.0.8
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - js/
